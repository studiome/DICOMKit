name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build package for macOS
        run: swift build

      - name: Test package on macOS
        run: swift test

      - name: Fuzz DICOMFile/DICOMULPDU/DICOMDIMSECommand
        # A bounded campaign, not the full local one: enough iterations to
        # cost roughly a minute of runner time on every run, seeded from the
        # run ID so successive CI runs explore different mutations instead
        # of repeating the same ones. `swift test` fails this step (and the
        # job, since no `continue-on-error` is set) on any test failure; a
        # trap kills the process outright, which `swift test`'s own non-zero
        # exit status also surfaces as a failed step. See
        # DICOMKitTests/DICOMFuzzTests.swift for why a crash found here
        # can't be caught in-process and must be reproduced from the seed.
        run: DICOMKIT_FUZZ_ITERATIONS=400000 DICOMKIT_FUZZ_SEED=${{ github.run_id }} swift test --filter DICOMFuzzTests

      - name: Build package for iOS and iPadOS
        run: |
          ios_sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          swift build --triple arm64-apple-ios16.0 --sdk "$ios_sdk"

      - name: Test package on iOS Simulator
        run: |
          # The device set follows the pinned Xcode, so resolve a simulator by
          # what's installed instead of hardcoding a model that a future
          # runner image may drop.
          simulator="$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [^(]+' | sed 's/ *$//')"
          echo "Testing on $simulator"

          # SwiftPM generates one scheme per product (DICOMKit,
          # DICOMKitAuthoring, DICOMKitNetworking, DICOMKitBenchmark) plus an
          # aggregate "DICOMKit-Package" scheme, and only the aggregate
          # carries the test action. This split happened when the package
          # grew from one library product to three (06c3b3c); a future
          # product split won't change which scheme has the tests, so keep
          # using the aggregate here.
          set -o pipefail
          xcodebuild test \
            -scheme DICOMKit-Package \
            -destination "platform=iOS Simulator,name=$simulator" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee test-output.log

          # xcodebuild's own exit status is preserved by `set -o pipefail`
          # above, but that alone isn't enough: every test in this package is
          # swift-testing (@Test), not XCTest, so xcodebuild's "Executed 0
          # tests, with 0 failures" counter is meaningless here (that's the
          # XCTest counter) and xcodebuild happily prints
          # "** TEST SUCCEEDED **" and exits 0 even if the swift-testing
          # bundle never ran at all. Guard against that silent no-op by
          # requiring the swift-testing summary line to actually appear.
          if ! grep -qE '^✔ Test run with [0-9]+ tests? in [0-9]+ suites? passed' test-output.log; then
            echo "::error::No passing swift-testing run summary found in xcodebuild output — the test bundle may not have run at all."
            exit 1
          fi
