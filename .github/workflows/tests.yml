name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xcodebuild:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Run unit tests (macOS)
        run: >-
          xcodebuild test
          -project DICOMKit.xcodeproj
          -scheme DICOMKit
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO

      - name: Build (iOS, generic device)
        run: >-
          xcodebuild build
          -project DICOMKit.xcodeproj
          -scheme DICOMKit
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO

  spm:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: swift build
        run: swift build

      - name: swift test
        run: swift test
