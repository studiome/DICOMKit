name: Publish API documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build package symbol graphs
        run: |
          mkdir -p "$RUNNER_TEMP/symbol-graphs"
          swift build \
            -Xswiftc -emit-symbol-graph \
            -Xswiftc -emit-symbol-graph-dir \
            -Xswiftc "$RUNNER_TEMP/symbol-graphs"

      - name: Create static documentation site
        run: >-
          xcrun docc convert DICOMKit/DICOMKit.docc
          --additional-symbol-graph-dir "$RUNNER_TEMP/symbol-graphs"
          --output-path "$RUNNER_TEMP/site"
          --fallback-display-name DICOMKit
          --fallback-bundle-identifier org.studiome.DICOMKit
          --fallback-default-module-kind Framework
          --hosting-base-path "${{ steps.pages.outputs.base_path }}"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
